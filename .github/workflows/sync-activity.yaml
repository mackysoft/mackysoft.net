name: Sync Activity

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency:
  group: sync-activity-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}
  SYNC_COMMIT_MESSAGE: "chore(activity): sync external activity"

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: master
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync external activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:activity

      - name: Detect activity diff
        id: diff
        run: |
          if git diff --quiet --exit-code -- src/generated/activity.json public/generated/activity-covers; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_diff=true" >> "$GITHUB_OUTPUT"

      - name: Resolve GitHub App bot identity
        if: ${{ steps.diff.outputs.has_diff == 'true' }}
        id: app-bot
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Configure git author
        if: ${{ steps.diff.outputs.has_diff == 'true' }}
        run: |
          git config user.name "${{ steps.app-bot.outputs.name }}"
          git config user.email "${{ steps.app-bot.outputs.email }}"

      - name: Commit activity update
        if: ${{ steps.diff.outputs.has_diff == 'true' }}
        run: |
          git add src/generated/activity.json public/generated/activity-covers
          git commit -m "$SYNC_COMMIT_MESSAGE"

      - name: Push activity update
        if: ${{ steps.diff.outputs.has_diff == 'true' }}
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git push "https://x-access-token:${GITHUB_APP_TOKEN}@github.com/${GH_REPO}.git" HEAD:master
